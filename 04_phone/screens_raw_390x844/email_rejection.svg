<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844"><title>Phone screen – email_rejection</title><g stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="390" height="844" fill="#fff"/><text x="34" y="34" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111" text-anchor="start">2:47</text><rect x="135" y="12" width="120" height="32" rx="16" fill="#000"/><rect x="328" y="22" width="28" height="14" rx="4" fill="none" stroke="#111" stroke-width="1.6" opacity=".8"/><rect x="330" y="24" width="3.6" height="10" rx="2" fill="#E5484D"/><rect x="357" y="26" width="2.5" height="6" rx="1" fill="#111" opacity=".8"/><rect x="290" y="32" width="4" height="4" rx="1" fill="#111" opacity=".85"/><rect x="296" y="29" width="4" height="7" rx="1" fill="#111" opacity=".85"/><rect x="302" y="26" width="4" height="10" rx="1" fill="#111" opacity=".85"/><rect x="308" y="23" width="4" height="13" rx="1" fill="#111" opacity=".3"/><text x="24" y="104" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#111" text-anchor="start">Inbox</text><rect x="0" y="124" width="390" height="1" fill="#e5e5e5"/><text x="24" y="166" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#111" text-anchor="start">Hiring Team</text><text x="24" y="192" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#111" text-anchor="start">Re: Your application</text><text x="24" y="240" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#333" text-anchor="start">Dear Alex,</text><text x="24" y="266" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#333" text-anchor="start"></text><text x="24" y="292" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#333" text-anchor="start">Thank you for your interest in the</text><text x="24" y="318" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#333" text-anchor="start">Junior Designer position.</text><text x="24" y="344" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#333" text-anchor="start"></text><text x="24" y="370" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#333" text-anchor="start">After careful consideration, we have</text><text x="24" y="396" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#333" text-anchor="start">decided to move forward with other</text><text x="24" y="422" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#333" text-anchor="start">candidates whose experience more</text><text x="24" y="448" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#333" text-anchor="start">closely matches our needs.</text><text x="24" y="474" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#333" text-anchor="start"></text><text x="24" y="500" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#333" text-anchor="start">We wish you the best in your search.</text><rect x="18" y="354" width="300" height="26" fill="#FFE38A" opacity=".6"/><rect x="127" y="828" width="136" height="5" rx="2.5" fill="#111" opacity=".8"/></g></svg>