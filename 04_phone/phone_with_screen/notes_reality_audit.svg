<svg xmlns="http://www.w3.org/2000/svg" viewBox="-224 -450 448 900" width="448" height="900"><title>Phone – notes_reality_audit</title><g transform="scale(1)"><rect x="-212" y="-286" width="4" height="60" rx="2" fill="#15171d"/><rect x="208" y="-246" width="4" height="90" rx="2" fill="#15171d"/><rect x="-212" y="-206" width="4" height="60" rx="2" fill="#15171d"/><rect x="-209" y="-436" width="418" height="872" rx="58" fill="#1A1D24" stroke="#0A0B0F" stroke-width="3"/><rect x="-204" y="-431" width="408" height="862" rx="54" fill="none" stroke="#3c3f45" stroke-width="2"/><defs><clipPath id="scr76"><rect x="0" y="0" width="390" height="844" rx="46"/></clipPath></defs><g stroke-linecap="round" stroke-linejoin="round"><g transform="translate(-195.0 -422.0)"><g clip-path="url(#scr76)"><rect x="0" y="0" width="390" height="844" fill="#F6F1E3"/><text x="34" y="34" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111" text-anchor="start">2:47</text><rect x="135" y="12" width="120" height="32" rx="16" fill="#000"/><rect x="328" y="22" width="28" height="14" rx="4" fill="none" stroke="#111" stroke-width="1.6" opacity=".8"/><rect x="330" y="24" width="3.6" height="10" rx="2" fill="#E5484D"/><rect x="357" y="26" width="2.5" height="6" rx="1" fill="#111" opacity=".8"/><rect x="290" y="32" width="4" height="4" rx="1" fill="#111" opacity=".85"/><rect x="296" y="29" width="4" height="7" rx="1" fill="#111" opacity=".85"/><rect x="302" y="26" width="4" height="10" rx="1" fill="#111" opacity=".85"/><rect x="308" y="23" width="4" height="13" rx="1" fill="#111" opacity=".3"/><text x="24" y="110" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" fill="#111" text-anchor="start">Reality audit</text><text x="24" y="160" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="17" font-weight="800" fill="#111" text-anchor="start">What I actually have:</text><text x="24" y="194" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="16" font-weight="400" fill="#3A3A3A" text-anchor="start">- a roof, a bed, a phone</text><text x="24" y="228" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="16" font-weight="400" fill="#3A3A3A" text-anchor="start">- 2 friends who still text me</text><text x="24" y="262" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="16" font-weight="400" fill="#3A3A3A" text-anchor="start">- 26 years of experience being me</text><text x="24" y="296" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="16" font-weight="400" fill="#3A3A3A" text-anchor="start"></text><text x="24" y="330" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="17" font-weight="800" fill="#111" text-anchor="start">What I am comparing:</text><text x="24" y="364" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="16" font-weight="400" fill="#3A3A3A" text-anchor="start">- their best 1% moments</text><text x="24" y="398" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="16" font-weight="400" fill="#3A3A3A" text-anchor="start">- vs my worst 3am thoughts</text><text x="24" y="432" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="16" font-weight="400" fill="#3A3A3A" text-anchor="start"></text><text x="24" y="466" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="17" font-weight="800" fill="#111" text-anchor="start">One thing today:</text><text x="24" y="500" font-family="'Caveat', 'Comic Sans MS', cursive" font-size="16" font-weight="400" fill="#3A3A3A" text-anchor="start">- 10 minutes outside. no phone.</text><rect x="0" y="172" width="390" height="1" fill="#C9BFA8" opacity=".5"/><rect x="0" y="206" width="390" height="1" fill="#C9BFA8" opacity=".5"/><rect x="0" y="240" width="390" height="1" fill="#C9BFA8" opacity=".5"/><rect x="0" y="274" width="390" height="1" fill="#C9BFA8" opacity=".5"/><rect x="0" y="308" width="390" height="1" fill="#C9BFA8" opacity=".5"/><rect x="0" y="342" width="390" height="1" fill="#C9